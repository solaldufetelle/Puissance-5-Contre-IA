<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateau Puissance 5</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 2px 0; }
  svg {
    display: block; width: 100%; height: auto;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Colonnes cliquables : toute la hauteur de la colonne réagit */
  .colonne { fill: transparent; cursor: pointer; outline: none; }
  .colonne:hover { fill: rgba(255, 255, 255, 0.11); }
  .colonne:focus-visible { fill: rgba(255, 255, 255, 0.18); }
  svg.inactif .colonne { cursor: default; pointer-events: none; }

  /* Chute du dernier jeton (il passe derrière la grille, visible dans les trous) */
  .chute {
    animation-name: chute;
    animation-timing-function: cubic-bezier(.5, 0, .9, .55);
    animation-fill-mode: both;
  }
  @keyframes chute {
    from { transform: translateY(var(--h)); }
    to   { transform: translateY(0); }
  }
  /* Anneau blanc du dernier coup et éclats de la ligne gagnante : apparaissent après la chute */
  .apparition { animation: apparition .18s ease-out both; }
  @keyframes apparition { from { opacity: 0; } to { opacity: 1; } }
  .eclat { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .chute, .apparition, .eclat { animation: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Plateau de Puissance 5"></svg>
</div>

<script>
(function () {
  "use strict";

  // ---------- Géométrie du plateau (unités du viewBox) ----------
  var NL = 7, NC = 9;            // lignes, colonnes
  var CASE = 70, MARGE = 14;
  var LARG = NC * CASE + 2 * MARGE;
  var HAUT = NL * CASE + 2 * MARGE;
  var R_TROU = 29, R_JETON = 31.5, R_ANNEAU = 32.5;

  function cx(c) { return MARGE + c * CASE + CASE / 2; }
  function cy(r) { return MARGE + r * CASE + CASE / 2; }   // r compté depuis le haut

  var svg = document.getElementById("svg");
  var wrap = document.getElementById("wrap");
  svg.setAttribute("viewBox", "0 0 " + LARG + " " + HAUT);

  // ---------- Squelette du SVG (construit une seule fois) ----------
  function cheminPlateau() {
    var x = 0, y = 0, w = LARG, h = HAUT, rr = 26;
    var d = "M" + (x + rr) + "," + y + " H" + (x + w - rr) +
            " A" + rr + "," + rr + " 0 0 1 " + (x + w) + "," + (y + rr) +
            " V" + (y + h - rr) +
            " A" + rr + "," + rr + " 0 0 1 " + (x + w - rr) + "," + (y + h) +
            " H" + (x + rr) +
            " A" + rr + "," + rr + " 0 0 1 " + x + "," + (y + h - rr) +
            " V" + (y + rr) +
            " A" + rr + "," + rr + " 0 0 1 " + (x + rr) + "," + y + " Z ";
    for (var r = 0; r < NL; r++) {
      for (var c = 0; c < NC; c++) {
        d += "M" + (cx(c) - R_TROU) + "," + cy(r) +
             " a" + R_TROU + "," + R_TROU + " 0 1,0 " + (2 * R_TROU) + ",0" +
             " a" + R_TROU + "," + R_TROU + " 0 1,0 " + (-2 * R_TROU) + ",0 Z ";
      }
    }
    return d;
  }

  function squelette() {
    var s = "";
    s += '<defs>' +
      '<radialGradient id="gJ" cx="35%" cy="30%" r="80%">' +
        '<stop offset="0" stop-color="#fff4b0"/><stop offset=".5" stop-color="#ffd12e"/><stop offset="1" stop-color="#d29200"/>' +
      '</radialGradient>' +
      '<radialGradient id="gR" cx="35%" cy="30%" r="80%">' +
        '<stop offset="0" stop-color="#ff9a90"/><stop offset=".5" stop-color="#e8322e"/><stop offset="1" stop-color="#94100c"/>' +
      '</radialGradient>' +
      '<linearGradient id="gP" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#2b53bd"/><stop offset="1" stop-color="#18337f"/>' +
      '</linearGradient>' +
    '</defs>';
    // fond sombre visible à travers les trous vides
    s += '<rect x="0" y="0" width="' + LARG + '" height="' + HAUT + '" rx="26" fill="#09122e"/>';
    s += '<g id="fantome"></g>';
    s += '<g id="jetons"></g>';
    // grille avant, percée de 63 trous
    s += '<path d="' + cheminPlateau() + '" fill="url(#gP)" fill-rule="evenodd" stroke="#10245f" stroke-width="3"/>';
    // liseré de chaque trou
    var rims = "";
    for (var r = 0; r < NL; r++) {
      for (var c = 0; c < NC; c++) {
        rims += '<circle cx="' + cx(c) + '" cy="' + cy(r) + '" r="' + R_TROU +
                '" fill="none" stroke="rgba(6,14,50,.55)" stroke-width="3"/>';
      }
    }
    s += '<g pointer-events="none">' + rims + '</g>';
    s += '<g id="anneau" pointer-events="none"></g>';
    s += '<g id="eclats" pointer-events="none"></g>';
    // zones cliquables (une par colonne, toute la hauteur)
    var zones = "";
    for (var k = 0; k < NC; k++) {
      zones += '<rect class="colonne" data-c="' + k + '" tabindex="0" role="button" aria-label="Colonne ' + (k + 1) + '"' +
               ' x="' + (MARGE + k * CASE) + '" y="0" width="' + CASE + '" height="' + HAUT + '"/>';
    }
    s += '<g id="zones">' + zones + '</g>';
    return s;
  }
  svg.innerHTML = squelette();

  var G = {
    fantome: document.getElementById("fantome"),
    jetons:  document.getElementById("jetons"),
    anneau:  document.getElementById("anneau"),
    eclats:  document.getElementById("eclats")
  };

  // ---------- Dessin ----------
  function jeton(r, c, joueur) {
    var degrade = joueur === 1 ? "gJ" : "gR";
    var trait = joueur === 1 ? "#a87000" : "#6e0c09";
    return '<circle cx="' + cx(c) + '" cy="' + cy(r) + '" r="' + R_JETON + '" fill="url(#' + degrade + ')"/>' +
           '<circle cx="' + cx(c) + '" cy="' + cy(r) + '" r="20" fill="none" stroke="' + trait +
           '" stroke-opacity=".5" stroke-width="3"/>';
  }

  var A = null;               // derniers arguments reçus de Streamlit
  var dernierN = null;        // nombre de coups lors du dernier rendu
  var anim = null;            // {n, t} : début de l'animation du dernier coup
  var verrou = null;          // nombre de coups pour lequel un clic a déjà été envoyé
  var verrouT = 0;            // heure de ce clic (le verrou expire après 3 s si rien ne se passe)

  function verrouille() {
    return verrou !== null && A && verrou === A.n_coups && (Date.now() - verrouT) < 3000;
  }

  function rendre(args) {
    A = args;
    var grille = args.grille;
    var n = args.n_coups;

    if (dernierN !== null && n > dernierN) { anim = { n: n, t: performance.now() }; }
    dernierN = n;
    var ecoule = null;
    if (anim && anim.n === n) {
      ecoule = (performance.now() - anim.t) / 1000;
      if (ecoule > 1.5) { ecoule = null; }
    }

    var der = args.derniere;                       // [ligne depuis le haut, colonne] ou null
    var duree = der ? 0.22 + 0.06 * der[0] : 0;

    var html = "";
    for (var r = 0; r < NL; r++) {
      for (var c = 0; c < NC; c++) {
        var v = grille[r][c];
        if (!v) { continue; }
        var estDernier = der && der[0] === r && der[1] === c;
        if (estDernier && ecoule !== null) {
          html += '<g class="chute" style="--h:' + (-(cy(r) + R_JETON + 6)) + 'px;animation-duration:' +
                  duree + 's;animation-delay:' + (-ecoule) + 's">' + jeton(r, c, v) + '</g>';
        } else {
          html += jeton(r, c, v);
        }
      }
    }
    G.jetons.innerHTML = html;

    // Anneau blanc autour du dernier jeton posé
    var delai = (ecoule !== null) ? (duree - ecoule) : 0;
    var styleDelai = (ecoule !== null) ? ' class="apparition" style="animation-delay:' + delai + 's"' : '';
    G.anneau.innerHTML = der
      ? '<g' + styleDelai + '><circle cx="' + cx(der[1]) + '" cy="' + cy(der[0]) + '" r="' + R_ANNEAU +
        '" fill="none" stroke="#ffffff" stroke-width="4.5"/></g>'
      : "";

    // Éclats sur les jetons de la ligne gagnante
    var gag = args.gagnantes || [];
    var e = "";
    for (var i = 0; i < gag.length; i++) {
      e += '<circle class="eclat" cx="' + cx(gag[i][1]) + '" cy="' + cy(gag[i][0]) + '" r="8" fill="#ffffff"/>';
    }
    G.eclats.innerHTML = gag.length
      ? '<g' + (ecoule !== null ? ' class="apparition" style="animation-delay:' + delai + 's"' : '') + '>' + e + '</g>'
      : "";

    G.fantome.innerHTML = "";
    svg.setAttribute("class", args.actif ? "" : "inactif");
    ajusterHauteur();
  }

  // Jeton "fantôme" : montre où tombera le jeton dans la colonne survolée
  function ligneLibre(c) {
    if (!A) { return -1; }
    for (var r = NL - 1; r >= 0; r--) {
      if (!A.grille[r][c]) { return r; }
    }
    return -1;
  }
  function montrerFantome(c) {
    if (!A || !A.actif || verrouille()) { G.fantome.innerHTML = ""; return; }
    var r = ligneLibre(c);
    G.fantome.innerHTML = (r < 0) ? "" :
      '<g opacity=".5">' + jeton(r, c, A.couleur_humain) + '</g>';
  }

  // ---------- Interactions ----------
  function jouer(c) {
    if (!A || !A.actif) { return; }
    if (verrouille()) { return; }                                 // un clic est déjà parti
    if (ligneLibre(c) < 0) { return; }                            // colonne pleine
    verrou = A.n_coups;
    verrouT = Date.now();
    G.fantome.innerHTML = "";
    envoyer("streamlit:setComponentValue", { value: { col: c, t: Date.now() + Math.random() }, dataType: "json" });
  }

  svg.addEventListener("click", function (ev) {
    var c = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-c") : null;
    if (c !== null) { jouer(parseInt(c, 10)); }
  });
  svg.addEventListener("mouseover", function (ev) {
    var c = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-c") : null;
    if (c !== null) { montrerFantome(parseInt(c, 10)); }
  });
  svg.addEventListener("mouseleave", function () { G.fantome.innerHTML = ""; });
  svg.addEventListener("keydown", function (ev) {
    var c = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-c") : null;
    if (c !== null && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); jouer(parseInt(c, 10)); }
  });
  // Raccourci clavier : touches 1 à 9
  document.addEventListener("keydown", function (ev) {
    if (ev.key >= "1" && ev.key <= "9" && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      jouer(parseInt(ev.key, 10) - 1);
    }
  });

  // ---------- Protocole Streamlit (composant bidirectionnel) ----------
  function envoyer(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function ajusterHauteur() {
    var h = Math.ceil(wrap.getBoundingClientRect().height) + 4;
    envoyer("streamlit:setFrameHeight", { height: h });
  }
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") { rendre(ev.data.args); }
  });
  window.addEventListener("resize", ajusterHauteur);
  envoyer("streamlit:componentReady", { apiVersion: 1 });
  ajusterHauteur();
})();
</script>
</body>
</html>
